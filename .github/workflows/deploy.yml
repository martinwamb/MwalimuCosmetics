name: Deploy to Hetzner

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY:  ${{ secrets.DEPLOY_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_DIR:  ${{ secrets.DEPLOY_DIR }}
      APP_PORT:    3001
      FRONT_PORT:  3002

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.DEPLOY_KEY }}

      - name: Sync source files to server
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude ".git" \
            --exclude "node_modules/" \
            --exclude ".next/" \
            --exclude "apps/front/.next/" \
            --exclude "apps/front/out/" \
            --exclude "apps/back/dist/" \
            --filter "P .env" \
            --filter "P .env.*" \
            ./ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/

      - name: Install, migrate, build, restart
        run: |
          ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST \
            "DEPLOY_DIR='$DEPLOY_DIR' APP_PORT='$APP_PORT' FRONT_PORT='$FRONT_PORT' bash -s" <<'ENDSSH'
          set -e
          cd "$DEPLOY_DIR"

          # Ensure backend PORT is set in .env
          env_file="apps/back/.env"
          if [ -f "$env_file" ]; then
            if grep -q '^PORT=' "$env_file"; then
              sed -i "s|^PORT=.*|PORT=${APP_PORT:-3001}|" "$env_file"
            else
              printf '\nPORT=%s\n' "${APP_PORT:-3001}" >> "$env_file"
            fi
          fi

          # Install dependencies (npm install — no lockfile required)
          npm install

          # Regenerate Prisma client against the installed version
          DATABASE_URL=$(grep '^DATABASE_URL=' apps/back/.env | cut -d= -f2-) \
            node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma

          # Apply any schema changes (additive only — never drop tables or columns).
          # Removing --accept-data-loss preserves tables outside the Prisma schema
          # (e.g. mirror_* tables created by raw SQL in the application layer).
          DATABASE_URL=$(grep '^DATABASE_URL=' apps/back/.env | cut -d= -f2-) \
            node_modules/.bin/prisma db push \
              --schema packages/db/prisma/schema.prisma

          # Build frontend
          # NEXT_SKIP_LOCKFILE_PATCH=1 prevents Next.js 14 from trying to run
          # 'npm install' internally to patch missing swc deps — which fails in
          # a workspace setup without a committed package-lock.json.
          cd apps/front && NEXT_SKIP_LOCKFILE_PATCH=1 npx next build && cd ../..

          # Build backend
          npm run build --workspace=@mwalimu/back

          # Restart services
          pm2 restart mwalimu-front || \
            pm2 start node_modules/.bin/next --name mwalimu-front -- start -p ${FRONT_PORT:-3002}
          pm2 restart mwalimu-back || \
            pm2 start apps/back/dist/index.js --name mwalimu-back
          pm2 save
          ENDSSH
